services:
  postgres:
    image: postgres:16-alpine
    ports:
      # Host 5433 avoids conflict with a local Postgres on 5432 (Homebrew, Postgres.app, etc.)
      - '5433:5432'
    environment:
      POSTGRES_USER: hackathon
      POSTGRES_PASSWORD: hackathon
      POSTGRES_DB: hackathon
    volumes:
      - hackathon_pg:/var/lib/postgresql/data

volumes:
  hackathon_pg:
